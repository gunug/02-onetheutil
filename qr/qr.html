<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon-qr.svg">
<title>QR 코드 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- qrcode-generator (브라우저 QR 인코더, 서버 불필요) -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root {
    --brand-yellow:#FFD400; --brand-yellow-soft:#FFE766; --brand-yellow-deep:#C9A600; --on-brand:#1A1A17;
    --ink:#F5F4EC; --body:#CFCDC2; --muted:#8E8C82; --hairline:#33332B;
    --canvas:#121210; --surface:#1C1C17; --surface-soft:#26261F;
    --sh-sm:0 1px 2px rgba(0,0,0,.4); --sh-md:0 4px 16px rgba(0,0,0,.45);
    --r-sm:6px; --r-md:10px; --r-lg:16px;
    --font:"Inter",-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 40px 24px 64px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    font-family: var(--font); background: var(--canvas); color: var(--body);
    -webkit-font-smoothing: antialiased;
  }
  .eyebrow { display:inline-block; background:#161613; color:var(--brand-yellow); font-size:11px; font-weight:600;
             letter-spacing:.12em; text-transform:uppercase; padding:5px 12px; border-radius:9999px; margin-bottom:8px; }
  .head { text-align:center; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing:-.02em; color: var(--ink); margin: 0; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .wrap { width:100%; max-width:1000px; display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start; }
  @media(max-width:820px){ .wrap{ grid-template-columns:1fr; } }

  .panel { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:18px; }
  .panel + .panel { margin-top:16px; }
  .panel h2 { font-size:13px; font-weight:700; color:var(--ink); margin:0 0 14px; letter-spacing:.02em; }

  /* 탭 */
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tab {
    font-family:var(--font); font-size:12px; font-weight:700; padding:8px 14px; border-radius:9999px;
    border:1px solid var(--hairline); background:var(--surface); color:var(--muted); cursor:pointer; transition:.12s;
  }
  .tab:hover { color:var(--ink); border-color:var(--brand-yellow-deep); }
  .tab.on { background:var(--brand-yellow); color:var(--on-brand); border-color:var(--brand-yellow); }

  .pane { display:none; flex-direction:column; gap:12px; }
  .pane.on { display:flex; }

  .field { display:flex; flex-direction:column; gap:6px; }
  .field > label { font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media(max-width:520px){ .row{ grid-template-columns:1fr; } }

  input[type=text], input[type=url], input[type=tel], input[type=email], input[type=number], select, textarea {
    width:100%; background:var(--surface-soft); border:1px solid var(--hairline); border-radius:var(--r-md);
    color:var(--ink); font-family:var(--font); font-size:13px; padding:9px 12px;
  }
  textarea { font-family:var(--mono); line-height:1.6; min-height:110px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--brand-yellow); }
  select { cursor:pointer; }
  input[type=color] {
    width:100%; height:36px; padding:2px; background:var(--surface-soft);
    border:1px solid var(--hairline); border-radius:var(--r-md); cursor:pointer;
  }
  input[type=range] { width:100%; accent-color:var(--brand-yellow); }
  .check { flex-direction:row; align-items:center; gap:8px; }
  .check input { accent-color:var(--brand-yellow); width:15px; height:15px; }
  .check label { text-transform:none; letter-spacing:0; font-size:12px; color:var(--body); }

  .btn {
    font-family:var(--font); font-size:13px; font-weight:700; padding:9px 18px; border-radius:var(--r-md);
    border:1px solid var(--hairline); background:var(--surface); color:var(--body); cursor:pointer; transition:.12s;
  }
  .btn:hover:not(:disabled) { color:var(--ink); border-color:var(--brand-yellow); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background:var(--brand-yellow); color:var(--on-brand); border-color:var(--brand-yellow); }
  .btn-primary:hover:not(:disabled) { background:var(--brand-yellow-soft); color:var(--on-brand); }
  .btn-sm { padding:7px 12px; font-size:12px; }

  /* 미리보기 */
  .preview { position:sticky; top:20px; }
  .qbox {
    display:flex; align-items:center; justify-content:center; padding:16px;
    background:var(--surface-soft); border:1px solid var(--hairline); border-radius:var(--r-md); min-height:260px;
  }
  #canvas { max-width:100%; height:auto; image-rendering:pixelated; border-radius:4px; box-shadow:var(--sh-sm); }
  .err { color:#FF8A7A; font-size:12px; text-align:center; line-height:1.6; }
  .info { font-size:11px; color:var(--muted); font-family:var(--mono); text-align:center; margin-top:10px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .actions .btn { flex:1 1 auto; }

  .toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--brand-yellow); color:var(--on-brand); font-size:13px; font-weight:700;
    padding:10px 20px; border-radius:9999px; box-shadow:var(--sh-md); opacity:0; pointer-events:none; transition:.2s;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="head">
    <span class="eyebrow">QR</span>
    <h1>QR 코드 생성기</h1>
    <p class="sub">브라우저에서 생성 (데이터 서버 전송 없음) · PNG / SVG 저장</p>
  </div>

  <div class="wrap">
    <!-- 입력 -->
    <div>
      <div class="panel">
        <div class="tabs">
          <button class="tab on" data-pane="text">텍스트</button>
          <button class="tab" data-pane="url">URL</button>
          <button class="tab" data-pane="wifi">WiFi</button>
          <button class="tab" data-pane="card">연락처</button>
          <button class="tab" data-pane="sms">문자·전화</button>
        </div>

        <div class="pane on" id="pane-text">
          <div class="field">
            <label for="t-text">내용</label>
            <textarea id="t-text" placeholder="QR로 만들 텍스트 입력" spellcheck="false"></textarea>
          </div>
        </div>

        <div class="pane" id="pane-url">
          <div class="field">
            <label for="t-url">주소</label>
            <input type="text" id="t-url" placeholder="https://example.com" spellcheck="false">
          </div>
        </div>

        <div class="pane" id="pane-wifi">
          <div class="row">
            <div class="field">
              <label for="w-ssid">SSID (네트워크 이름)</label>
              <input type="text" id="w-ssid" placeholder="MyWiFi" spellcheck="false">
            </div>
            <div class="field">
              <label for="w-enc">보안</label>
              <select id="w-enc">
                <option value="WPA">WPA / WPA2 / WPA3</option>
                <option value="WEP">WEP</option>
                <option value="nopass">없음 (개방)</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="w-pass">비밀번호</label>
            <input type="text" id="w-pass" placeholder="비밀번호" spellcheck="false">
          </div>
          <div class="field check">
            <input type="checkbox" id="w-hidden">
            <label for="w-hidden">숨김 네트워크</label>
          </div>
        </div>

        <div class="pane" id="pane-card">
          <div class="row">
            <div class="field"><label for="c-name">이름</label><input type="text" id="c-name" placeholder="홍길동"></div>
            <div class="field"><label for="c-org">회사</label><input type="text" id="c-org" placeholder="무지개상사"></div>
          </div>
          <div class="row">
            <div class="field"><label for="c-title">직함</label><input type="text" id="c-title" placeholder="대리"></div>
            <div class="field"><label for="c-tel">전화</label><input type="tel" id="c-tel" placeholder="010-1234-5678"></div>
          </div>
          <div class="row">
            <div class="field"><label for="c-email">이메일</label><input type="email" id="c-email" placeholder="hong@example.com"></div>
            <div class="field"><label for="c-url">웹사이트</label><input type="text" id="c-url" placeholder="https://example.com"></div>
          </div>
          <div class="field"><label for="c-addr">주소</label><input type="text" id="c-addr" placeholder="서울시 ..."></div>
          <div class="field"><label for="c-memo">메모</label><input type="text" id="c-memo" placeholder=""></div>
        </div>

        <div class="pane" id="pane-sms">
          <div class="row">
            <div class="field">
              <label for="s-kind">종류</label>
              <select id="s-kind">
                <option value="sms">문자 (SMS)</option>
                <option value="tel">전화 걸기</option>
                <option value="mailto">메일 보내기</option>
              </select>
            </div>
            <div class="field"><label for="s-to">번호 / 메일</label><input type="text" id="s-to" placeholder="010-1234-5678"></div>
          </div>
          <div class="field"><label for="s-body">내용</label><input type="text" id="s-body" placeholder="미리 채울 메시지 (선택)"></div>
        </div>
      </div>

      <div class="panel">
        <h2>모양</h2>
        <div class="row">
          <div class="field">
            <label for="o-ec">오류 정정 (EC)</label>
            <select id="o-ec">
              <option value="L">L — 7% 복원</option>
              <option value="M" selected>M — 15% 복원</option>
              <option value="Q">Q — 25% 복원</option>
              <option value="H">H — 30% 복원 (로고용)</option>
            </select>
          </div>
          <div class="field">
            <label for="o-size">크기 <span id="o-size-v" style="font-family:var(--mono)">512px</span></label>
            <input type="range" id="o-size" min="128" max="2048" step="32" value="512">
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="field">
            <label for="o-margin">여백 <span id="o-margin-v" style="font-family:var(--mono)">4</span></label>
            <input type="range" id="o-margin" min="0" max="10" step="1" value="4">
          </div>
          <div class="field">
            <label for="o-logo-file">가운데 로고 (선택)</label>
            <div style="display:flex;gap:8px">
              <button class="btn btn-sm" id="o-logo-pick" style="flex:1">이미지 선택</button>
              <button class="btn btn-sm" id="o-logo-clear" disabled>제거</button>
            </div>
            <input type="file" id="o-logo-file" accept="image/*" hidden>
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <div class="field"><label for="o-fg">전경색</label><input type="color" id="o-fg" value="#121210"></div>
          <div class="field"><label for="o-bg">배경색</label><input type="color" id="o-bg" value="#FFFFFF"></div>
        </div>
        <div class="field check" style="margin-top:12px">
          <input type="checkbox" id="o-transparent">
          <label for="o-transparent">배경 투명 (PNG·SVG)</label>
        </div>
      </div>
    </div>

    <!-- 미리보기 -->
    <div class="preview">
      <div class="panel">
        <h2>미리보기</h2>
        <div class="qbox">
          <canvas id="canvas" width="256" height="256"></canvas>
          <div class="err" id="err" hidden></div>
        </div>
        <div class="info" id="info">—</div>
        <div class="actions">
          <button class="btn btn-primary" id="dl-png">PNG 저장</button>
          <button class="btn" id="dl-svg">SVG 저장</button>
          <button class="btn" id="copy-img">이미지 복사</button>
          <button class="btn" id="copy-txt">내용 복사</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">복사됨</div>

<script>
  const $ = id => document.getElementById(id);
  const canvas = $("canvas"), ctx = canvas.getContext("2d");
  const errEl = $("err"), infoEl = $("info"), toast = $("toast");
  const STORE = "onethe-qr-v1";

  let logoImg = null;          // 로고 Image 객체
  let logoURL = null;          // objectURL (정리용)
  let modules = null;          // 현재 QR 모듈 행렬 (SVG 저장용)
  let lastPayload = "";        // 현재 인코딩된 문자열

  function showToast(msg) {
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(showToast._t); showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
  }

  /* ---------- 탭 ---------- */
  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b === btn));
      document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + btn.dataset.pane));
      render();
    });
  });
  const activeTab = () => document.querySelector(".tab.on").dataset.pane;

  /* ---------- 페이로드 조립 ---------- */
  // WIFI / vCard 규격상 \ ; , : 는 이스케이프 필요
  const escWifi = s => String(s).replace(/([\\;,:"])/g, "\\$1");
  const escVc   = s => String(s).replace(/([\\;,])/g, "\\$1").replace(/\n/g, "\\n");
  const v = id => $(id).value.trim();

  function buildPayload() {
    switch (activeTab()) {
      case "text": return $("t-text").value;

      case "url": {
        let u = v("t-url");
        if (!u) return "";
        if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u;   // 스킴 없으면 https 보충
        return u;
      }

      case "wifi": {
        const ssid = v("w-ssid");
        if (!ssid) return "";
        const enc = $("w-enc").value;
        const pass = enc === "nopass" ? "" : v("w-pass");
        let s = `WIFI:T:${enc};S:${escWifi(ssid)};`;
        if (pass) s += `P:${escWifi(pass)};`;
        if ($("w-hidden").checked) s += "H:true;";
        return s + ";";
      }

      case "card": {
        const name = v("c-name");
        const parts = ["BEGIN:VCARD", "VERSION:3.0"];
        if (name) { parts.push(`N:${escVc(name)};;;;`, `FN:${escVc(name)}`); }
        if (v("c-org"))   parts.push(`ORG:${escVc(v("c-org"))}`);
        if (v("c-title")) parts.push(`TITLE:${escVc(v("c-title"))}`);
        if (v("c-tel"))   parts.push(`TEL;TYPE=CELL:${escVc(v("c-tel"))}`);
        if (v("c-email")) parts.push(`EMAIL:${escVc(v("c-email"))}`);
        if (v("c-url"))   parts.push(`URL:${escVc(v("c-url"))}`);
        if (v("c-addr"))  parts.push(`ADR:;;${escVc(v("c-addr"))};;;;`);
        if (v("c-memo"))  parts.push(`NOTE:${escVc(v("c-memo"))}`);
        parts.push("END:VCARD");
        return parts.length > 3 ? parts.join("\n") : "";
      }

      case "sms": {
        const to = v("s-to"), body = v("s-body"), kind = $("s-kind").value;
        if (!to) return "";
        if (kind === "tel") return "tel:" + to.replace(/[^\d+*#]/g, "");
        if (kind === "mailto") return "mailto:" + to + (body ? "?body=" + encodeURIComponent(body) : "");
        return "SMSTO:" + to.replace(/[^\d+*#]/g, "") + ":" + body;
      }
    }
    return "";
  }

  /* ---------- QR 생성 ---------- */
  // qrcode-generator 기본 인코더는 latin1만 처리 → UTF-8 바이트를 latin1 문자열로 넘긴다
  function toLatin1Utf8(str) {
    const bytes = new TextEncoder().encode(str);
    let out = "";
    for (let i = 0; i < bytes.length; i += 8192) out += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return out;
  }

  function makeQR(text, ec) {
    const qr = qrcode(0, ec);          // 0 = 데이터 길이에 맞춰 버전 자동
    qr.addData(toLatin1Utf8(text), "Byte");
    qr.make();
    const n = qr.getModuleCount();
    const m = [];
    for (let r = 0; r < n; r++) { const row = []; for (let c = 0; c < n; c++) row.push(qr.isDark(r, c)); m.push(row); }
    return { modules: m, count: n, version: (n - 17) / 4 };
  }

  /* ---------- 렌더 ---------- */
  function render() {
    const payload = buildPayload();
    lastPayload = payload;
    $("o-size-v").textContent = $("o-size").value + "px";
    $("o-margin-v").textContent = $("o-margin").value;
    saveState();

    if (!payload) {
      modules = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.hidden = true; errEl.hidden = false;
      errEl.textContent = "내용을 입력하세요.";
      infoEl.textContent = "—";
      return;
    }

    let qr;
    try {
      qr = makeQR(payload, $("o-ec").value);
    } catch (e) {
      modules = null;
      canvas.hidden = true; errEl.hidden = false;
      errEl.textContent = "데이터가 너무 깁니다. 내용을 줄이거나 오류 정정 단계를 낮추세요.";
      infoEl.textContent = "—";
      return;
    }

    modules = qr.modules;
    canvas.hidden = false; errEl.hidden = true;

    const margin = +$("o-margin").value;
    const total = qr.count + margin * 2;
    const want = +$("o-size").value;
    const scale = Math.max(1, Math.floor(want / total));   // 모듈 경계가 픽셀에 딱 맞도록 정수 배율
    const px = total * scale;

    canvas.width = canvas.height = px;
    canvas.style.width = Math.min(px, 288) + "px";

    const transparent = $("o-transparent").checked;
    ctx.clearRect(0, 0, px, px);
    if (!transparent) { ctx.fillStyle = $("o-bg").value; ctx.fillRect(0, 0, px, px); }

    ctx.fillStyle = $("o-fg").value;
    for (let r = 0; r < qr.count; r++) {
      for (let c = 0; c < qr.count; c++) {
        if (modules[r][c]) ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
      }
    }

    if (logoImg) drawLogo(px);

    const bytes = new TextEncoder().encode(payload).length;
    infoEl.textContent = `버전 ${qr.version} · ${qr.count}×${qr.count} 모듈 · ${px}px · ${bytes} bytes`;
  }

  function drawLogo(px) {
    const box = Math.round(px * 0.22);              // QR 면적의 약 5% — EC로 복원 가능한 범위
    const pad = Math.round(box * 0.08);
    const x = Math.round((px - box) / 2), y = x;
    ctx.fillStyle = $("o-transparent").checked ? "#FFFFFF" : $("o-bg").value;
    ctx.fillRect(x - pad, y - pad, box + pad * 2, box + pad * 2);
    const ratio = Math.min(box / logoImg.naturalWidth, box / logoImg.naturalHeight);
    const w = logoImg.naturalWidth * ratio, h = logoImg.naturalHeight * ratio;
    ctx.drawImage(logoImg, Math.round((px - w) / 2), Math.round((px - h) / 2), w, h);
  }

  /* ---------- SVG ---------- */
  function buildSVG() {
    if (!modules) return null;
    const n = modules.length, margin = +$("o-margin").value, total = n + margin * 2;
    let path = "";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (modules[r][c]) path += `M${c + margin} ${r + margin}h1v1h-1z`;
      }
    }
    const bg = $("o-transparent").checked ? "" : `<rect width="${total}" height="${total}" fill="${$("o-bg").value}"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${$("o-size").value}" height="${$("o-size").value}" shape-rendering="crispEdges">${bg}<path d="${path}" fill="${$("o-fg").value}"/></svg>`;
  }

  /* ---------- 저장 / 복사 ---------- */
  function fileStem() {
    const t = activeTab();
    return "qr-" + t + "-" + new Date().toISOString().slice(0, 10);
  }
  function download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  $("dl-png").addEventListener("click", () => {
    if (!modules) { showToast("생성된 QR 없음"); return; }
    canvas.toBlob(b => download(b, fileStem() + ".png"), "image/png");
  });

  $("dl-svg").addEventListener("click", () => {
    const svg = buildSVG();
    if (!svg) { showToast("생성된 QR 없음"); return; }
    if (logoImg) showToast("SVG에는 로고가 포함되지 않습니다");
    download(new Blob([svg], { type: "image/svg+xml" }), fileStem() + ".svg");
  });

  $("copy-img").addEventListener("click", () => {
    if (!modules) { showToast("생성된 QR 없음"); return; }
    canvas.toBlob(async b => {
      try {
        await navigator.clipboard.write([new ClipboardItem({ "image/png": b })]);
        showToast("이미지 복사됨");
      } catch { showToast("이 브라우저는 이미지 복사 미지원"); }
    }, "image/png");
  });

  $("copy-txt").addEventListener("click", async () => {
    if (!lastPayload) { showToast("복사할 내용 없음"); return; }
    try { await navigator.clipboard.writeText(lastPayload); showToast("내용 복사됨"); }
    catch { showToast("복사 실패"); }
  });

  /* ---------- 로고 ---------- */
  $("o-logo-pick").addEventListener("click", () => $("o-logo-file").click());
  $("o-logo-file").addEventListener("change", () => {
    const f = $("o-logo-file").files[0];
    $("o-logo-file").value = "";
    if (!f || !f.type.startsWith("image/")) { showToast("이미지 파일만 가능"); return; }
    if (logoURL) URL.revokeObjectURL(logoURL);
    logoURL = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      logoImg = img;
      $("o-logo-clear").disabled = false;
      if ($("o-ec").value !== "H") { $("o-ec").value = "H"; showToast("로고 사용 — EC를 H로 올림"); }
      render();
    };
    img.onerror = () => showToast("이미지를 읽을 수 없음");
    img.src = logoURL;
  });
  $("o-logo-clear").addEventListener("click", () => {
    if (logoURL) URL.revokeObjectURL(logoURL);
    logoURL = null; logoImg = null;
    $("o-logo-clear").disabled = true;
    render();
  });

  /* ---------- 상태 저장 ---------- */
  const SAVE_IDS = ["t-text","t-url","w-ssid","w-enc","w-pass","c-name","c-org","c-title","c-tel","c-email",
                    "c-url","c-addr","c-memo","s-kind","s-to","s-body","o-ec","o-size","o-margin","o-fg","o-bg"];
  const SAVE_CHECKS = ["w-hidden","o-transparent"];

  function saveState() {
    const d = { tab: activeTab(), f: {}, c: {} };
    SAVE_IDS.forEach(id => d.f[id] = $(id).value);
    SAVE_CHECKS.forEach(id => d.c[id] = $(id).checked);
    try { localStorage.setItem(STORE, JSON.stringify(d)); } catch {}
  }

  function loadState() {
    let d;
    try { d = JSON.parse(localStorage.getItem(STORE) || "null"); } catch {}
    if (!d) return;
    SAVE_IDS.forEach(id => { if (d.f && d.f[id] !== undefined) $(id).value = d.f[id]; });
    SAVE_CHECKS.forEach(id => { if (d.c && d.c[id] !== undefined) $(id).checked = d.c[id]; });
    if (d.tab) {
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.pane === d.tab));
      document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + d.tab));
    }
  }

  /* ---------- 부팅 ---------- */
  if (typeof qrcode === "undefined") {
    errEl.hidden = false; canvas.hidden = true;
    errEl.textContent = "QR 라이브러리를 불러오지 못했습니다. 네트워크를 확인하세요.";
  } else {
    document.querySelectorAll("input, select, textarea").forEach(el => {
      if (el.type === "file") return;
      el.addEventListener("input", render);
      el.addEventListener("change", render);
    });
    loadState();
    render();
  }
</script>
</body>
</html>
